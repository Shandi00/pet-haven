name: Integration Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  integration:
    name: Run backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI 不連 Atlas，用上面的 mongo service
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: pet_haven_test
      TEST_MONGODB_URI: mongodb://localhost:27017
      JWT_SECRET: test_jwt_secret_for_ci_only
      APP_ENV: test
      READINESS_RETRIES: 60
      READINESS_DELAY_MS: 2000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest

      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:asgi_app --port 5000 > server.log 2>&1 &
          echo "started server, PID: $!"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 $READINESS_RETRIES); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/ready || true)
            echo "attempt $i -> status=$status"
            if [ "$status" = "200" ]; then
              echo "readiness ok"
              exit 0
            fi
            sleep $(expr $READINESS_DELAY_MS / 1000)
          done
          echo "backend not ready"
          cat backend/server.log
          exit 1

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: backend/server.log
